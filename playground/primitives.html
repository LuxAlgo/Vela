<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Vela — UI primitives</title>
        <style>
            html,
            body {
                margin: 0;
                min-height: 100%;
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            }
            #app {
                min-height: 100vh;
                box-sizing: border-box;
                padding: 28px 36px 60px;
                background: var(--vela-bg);
                color: var(--vela-fg);
            }
            header {
                display: flex;
                align-items: center;
                gap: 16px;
                margin-bottom: 8px;
            }
            h1 {
                margin: 0;
                font-size: 20px;
                color: var(--vela-fg-bright);
            }
            .lead {
                margin: 0 0 24px;
                font-size: 13px;
                color: var(--vela-fg-muted);
                max-width: 760px;
                line-height: 1.5;
            }
            section {
                border: 1px solid var(--vela-border);
                border-radius: 10px;
                padding: 18px 20px;
                margin-bottom: 18px;
            }
            h2 {
                margin: 0 0 4px;
                font-size: 15px;
                color: var(--vela-fg-bright);
            }
            .note {
                margin: 0 0 14px;
                font-size: 12px;
                color: var(--vela-fg-muted);
            }
            .row {
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                gap: 10px;
                margin: 10px 0;
            }
            .row > .label {
                width: 110px;
                font-size: 12px;
                color: var(--vela-fg-muted);
            }
            .nav-demo {
                display: flex;
                gap: 16px;
            }
            .nav-demo .vela-tabs {
                width: 180px;
            }
            .panel {
                flex: 1;
                padding: 12px 14px;
                border: 1px dashed var(--vela-border);
                border-radius: 8px;
                font-size: 13px;
            }
            .w-320 {
                width: 320px;
            }
        </style>
    </head>
    <body>
        <div id="app"></div>
        <script type="module" src="./primitives.ts"></script>
    </body>
</html>
