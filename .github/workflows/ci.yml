# Typecheck, lint and test on every pull request and on pushes to main/dev,
# so the green check is visible on the repo and on every PR.
name: ci
on:
    pull_request:
    push:
        branches: [main, dev]

permissions:
    contents: read

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - run: npm run typecheck
            - run: npm run lint
            - run: npm test
